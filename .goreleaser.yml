# lb-17y
version: 2
project_name: lazybeads
builds:
  - id: lb
    main: ./cmd/lb
    binary: lb
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
